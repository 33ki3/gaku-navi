name: PR Regression

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Compare base and head and publish PR comment
    runs-on: ubuntu-latest
    outputs:
      comment_posted: ${{ steps.publish.outputs.comment_posted }}
      fallback_body_base64: ${{ steps.publish.outputs.fallback_body_base64 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            head/package-lock.json
      # Linux上の画面比較で日本語の字形を使うため、Noto CJKフォントを導入する
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          JP_FONT_FAMILY="$(fc-match --format='%{family}' 'Noto Sans CJK JP:lang=ja')"
          echo "Japanese screenshot font: ${JP_FONT_FAMILY}"
          if [[ "${JP_FONT_FAMILY}" != *"Noto Sans CJK JP"* ]]; then
            echo "Noto Sans CJK JP is unavailable on the runner" >&2
            exit 1
          fi
      - name: Install base dependencies
        id: base-install
        continue-on-error: true
        working-directory: base
        run: npm ci
      - name: Build base
        id: base-build
        if: steps.base-install.outcome == 'success'
        continue-on-error: true
        working-directory: base
        run: npm run build
      - name: Install base browsers
        id: base-browsers
        if: steps.base-build.outcome == 'success'
        continue-on-error: true
        working-directory: base
        run: npx playwright install --with-deps chromium webkit
      - name: Capture base observations
        id: base-capture
        if: steps.base-browsers.outcome == 'success'
        continue-on-error: true
        working-directory: base
        run: npm run regression -- capture
        env:
          E2E_PREVIEW: '1'
          REGRESSION_BRANCH: base
          REGRESSION_COMMIT: ${{ github.event.pull_request.base.sha }}
          REGRESSION_OUTPUT: tmp/regression-results/base
      - name: Install head dependencies
        id: head-install
        working-directory: head
        run: npm ci
      - name: Install head browsers
        id: head-browsers
        if: steps.head-install.outcome == 'success'
        working-directory: head
        run: npx playwright install --with-deps chrome webkit
      - name: Build head
        id: head-build
        if: steps.head-install.outcome == 'success'
        working-directory: head
        run: npm run build
      - name: Capture and compare head observations
        id: head-capture
        if: always() && steps.head-build.outcome == 'success' && steps.head-browsers.outcome == 'success'
        working-directory: head
        run: npm run regression -- capture
        env:
          E2E_PREVIEW: '1'
          REGRESSION_BRANCH: head
          REGRESSION_COMMIT: ${{ github.event.pull_request.head.sha }}
          REGRESSION_OUTPUT: tmp/regression-results/head
          REGRESSION_BASE_SCREENSHOT_DIR: ../base/tmp/regression-results/base/visual
          REGRESSION_BASE_CARDS_FILE: ../base/src/data/json/cards.json
          REGRESSION_BASE_PIDOL_FILE: ../base/src/data/json/pIdol.json
          REGRESSION_COMPARE_BASELINE: '1'
      - name: Compare observations, write report, and prepare PR comment
        if: always()
        working-directory: head
        run: npm run regression -- compare ../base/tmp/regression-results/base tmp/regression-results/head tmp/regression-results/report
        env:
          REGRESSION_VALIDATION_RESULT: ${{ steps.head-build.outcome == 'success' && steps.head-capture.outcome == 'success' && 'success' || 'failure' }}
          REGRESSION_BASE_CARDS_FILE: ../base/src/data/json/cards.json
          REGRESSION_BASE_PIDOL_FILE: ../base/src/data/json/pIdol.json
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Add report to Actions summary
        if: always() && hashFiles('head/tmp/regression-results/report/report.md') != ''
        working-directory: head
        run: cat tmp/regression-results/report/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post PR regression comment
        id: publish
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.PR_REGRESSION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          COMMENT_POSTED=false
          COMMENT_ROOT=head/tmp/pr-comment-assets
          COMMENT_FILE="$COMMENT_ROOT/comment.md"
          NO_IMAGE_FILE="$COMMENT_ROOT/comment-no-images.md"
          POST_BODY_FILE="$COMMENT_ROOT/comment-for-post.md"
          RUN_MARKER="<!-- pr-regression-run-${RUN_ID}-${RUN_ATTEMPT} -->"
          CAN_PUBLISH=false

          if [[ ! -L head && ! -L head/tmp && ! -L "$COMMENT_ROOT" && ! -L "$COMMENT_ROOT/images" && ! -L "$NO_IMAGE_FILE" && ! -L "$POST_BODY_FILE" ]] && \
            mkdir -p "$COMMENT_ROOT/images"; then
            CAN_PUBLISH=true
          fi

          if [[ "$CAN_PUBLISH" == 'true' && -f "$COMMENT_FILE" && ! -L "$COMMENT_FILE" ]]; then
            if { printf '%s\n' "$RUN_MARKER" && cat "$COMMENT_FILE"; } > "$POST_BODY_FILE"; then
              if [[ -n "${GH_TOKEN:-}" ]]; then
                COMMENT_ARGS=(pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$POST_BODY_FILE")
                while IFS= read -r -d '' screenshot; do
                  COMMENT_ARGS+=(--attach "$screenshot")
                done < <(find "$COMMENT_ROOT/images" -type f -name '*.png' -print0 | sort -z)
                if gh "${COMMENT_ARGS[@]}"; then
                  COMMENT_POSTED=true
                fi
              fi
            fi
          fi

          FALLBACK_BODY_BASE64=""
          if [[ "$COMMENT_POSTED" != 'true' && "$CAN_PUBLISH" == 'true' && -f "$NO_IMAGE_FILE" && ! -L "$NO_IMAGE_FILE" ]]; then
            FALLBACK_BODY_SIZE="$(stat -c '%s' "$NO_IMAGE_FILE" 2>/dev/null || printf '0')"
            if [[ "$FALLBACK_BODY_SIZE" =~ ^[0-9]+$ ]] && (( FALLBACK_BODY_SIZE <= 60000 )); then
              FALLBACK_BODY_BASE64="$({ printf '%s\n' "$RUN_MARKER"; cat "$NO_IMAGE_FILE"; } | base64 -w0)"
            fi
          fi

          {
            printf 'comment_posted=%s\n' "$COMMENT_POSTED"
            printf 'fallback_body_base64=%s\n' "$FALLBACK_BODY_BASE64"
          } >> "$GITHUB_OUTPUT"

  fallback-comment:
    name: Post text-only fallback comment
    needs: regression
    if: ${{ always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && needs.regression.outputs.comment_posted != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post text-only fallback
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          FALLBACK_BODY_BASE64: ${{ needs.regression.outputs.fallback_body_base64 }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          BODY_FILE=tmp/pr-regression-fallback.md
          RUN_MARKER="<!-- pr-regression-run-${RUN_ID}-${RUN_ATTEMPT} -->"

          if [[ -n "${FALLBACK_BODY_BASE64:-}" ]]; then
            if ! printf '%s' "$FALLBACK_BODY_BASE64" | base64 --decode > "$BODY_FILE"; then
              : > "$BODY_FILE"
            fi
          fi

          if [[ ! -s "$BODY_FILE" ]]; then
            printf '%s\n\n## 回帰テスト結果\n画像なしレポートを取得できませんでした。\n実行ログ: %s/%s/actions/runs/%s/attempts/%s\n' \
              "$RUN_MARKER" "$SERVER_URL" "$GH_REPO" "$RUN_ID" "$RUN_ATTEMPT" > "$BODY_FILE"
          fi

          EXISTING_COMMENTS="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json comments --jq '[.comments[].body] | join("\n")')"
          if grep -Fq -- "$RUN_MARKER" <<< "$EXISTING_COMMENTS"; then
            echo 'A comment for this workflow run already exists; skipping the fallback to avoid a duplicate.'
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$BODY_FILE"
